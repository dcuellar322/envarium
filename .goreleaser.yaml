version: 2
project_name: envarium

builds:
  - id: envarium
    main: ./cmd/envarium
    binary: envarium
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X envarium.dev/envarium/internal/foundation/buildinfo.version={{.Version}}
        -X envarium.dev/envarium/internal/foundation/buildinfo.commit={{.ShortCommit}}
        -X envarium.dev/envarium/internal/foundation/buildinfo.builtAt={{.Date}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: envarium
    name_template: 'envarium_{{ if eq .Os "darwin" }}Darwin{{ else }}Linux{{ end }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - docs/cli.md
      - docs/compatibility.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive-sboms
    artifacts: archive
    disable: false
    documents:
      - "{{ .ArtifactName }}.cyclonedx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

source:
  enabled: true

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  disable: true
