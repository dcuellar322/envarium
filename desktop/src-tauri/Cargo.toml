[package]
name = "envarium-desktop"
version = "1.0.0"
description = "Thin native desktop shell for Envarium"
authors = ["Envarium contributors"]
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "envarium_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "envarium-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
# Upstream ZIP 9 security fix; replace with a published patched release when available.
tauri-plugin-updater = { version = "=2.14.0", git = "https://github.com/tauri-apps/plugins-workspace", rev = "ba98bfadc4c868c9a7e1a226c83af528e1f11b89" }
url = "=2.5.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
