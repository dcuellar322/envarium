name: Public site deploy

on:
  pull_request:
    paths: ['site/**', 'docs/**', 'design/brand/**', 'scripts/sync-brand.mjs', 'scripts/brand-*.mjs', 'web/tests/visual/**']
  push:
    branches: [master]
  release:
    types: [published, unpublished, deleted, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SITE_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'master' || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:generate
      - run: pnpm --dir site releases
      - run: pnpm site:build
      - run: pnpm site:validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-deploy-${{ github.sha }}
          path: site/dist
          retention-days: 7

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment: site-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Check deployment configuration
        id: deployment
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_PROJECT_NAME" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare preview skipped because deployment credentials are not configured."
          fi
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.deployment.outputs.configured == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-site-deploy-${{ github.sha }}
          path: site/dist
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm --dir site exec wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch "pr-${{ github.event.pull_request.number }}" --commit-dirty=true

  production:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      ENVARIUM_DOMAIN: envarium.davidcuellar.tech
      LEGACY_CLOUDFLARE_PROJECT_NAME: switchyard-dcuellar
    steps:
      - name: Check deployment configuration
        id: deployment
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_PROJECT_NAME" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare production deploy skipped because deployment credentials are not configured."
          fi
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.deployment.outputs.configured == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-site-deploy-${{ github.sha }}
          path: site/dist
      - name: Ensure Envarium Pages project exists
        if: steps.deployment.outputs.configured == 'true'
        run: |
          projects="$(pnpm --dir site exec wrangler pages project list --json)"
          if ! jq -e --arg project "$CLOUDFLARE_PROJECT_NAME" 'any(.[]; .["Project Name"] == $project)' <<< "$projects" >/dev/null; then
            pnpm --dir site exec wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch master
          fi
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm --dir site exec wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch master --commit-dirty=true
      - name: Ensure canonical custom domain
        if: steps.deployment.outputs.configured == 'true'
        run: |
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/domains"
          domains="$(curl --fail-with-body --silent --show-error "$endpoint" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json')"
          jq -e '.success == true' <<< "$domains" >/dev/null
          if ! jq -e --arg domain "$ENVARIUM_DOMAIN" 'any(.result[]?; .name == $domain)' <<< "$domains" >/dev/null; then
            response="$(curl --fail-with-body --silent --show-error --request POST "$endpoint" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg name "$ENVARIUM_DOMAIN" '{name: $name}')")"
            jq -e '.success == true' <<< "$response" >/dev/null
          elif ! jq -e --arg domain "$ENVARIUM_DOMAIN" 'any(.result[]?; .name == $domain and .status == "active")' <<< "$domains" >/dev/null; then
            response="$(curl --fail-with-body --silent --show-error --request PATCH "$endpoint/$ENVARIUM_DOMAIN" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            jq -e '.success == true' <<< "$response" >/dev/null
            echo "Retried canonical custom-domain validation after checking its current status." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report registrar DNS readiness
        if: steps.deployment.outputs.configured == 'true'
        run: |
          if getent ahosts "$ENVARIUM_DOMAIN" >/dev/null 2>&1; then
            echo "$ENVARIUM_DOMAIN resolves. TLS readiness is checked next."
          else
            echo "::warning::Configure the Envarium CNAME in Namecheap; see docs/envarium-rebrand-checklist.md."
            echo "Registrar DNS setup remains pending in Namecheap." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Select reachable public origin
        if: steps.deployment.outputs.configured == 'true'
        id: public-origin
        run: |
          origin="https://$CLOUDFLARE_PROJECT_NAME.pages.dev"
          redirect_status=302
          if curl --fail --silent --show-error --head --max-time 15 "https://$ENVARIUM_DOMAIN/" >/dev/null 2>&1; then
            origin="https://$ENVARIUM_DOMAIN"
            redirect_status=301
            echo "Canonical hostname is active." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Canonical hostname is not active. Using the Envarium Pages hostname until DNS and TLS are ready."
            echo "Canonical DNS/TLS is pending. The public site and legacy redirect use $origin until activation." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "url=$origin" >> "$GITHUB_OUTPUT"
          echo "redirect-status=$redirect_status" >> "$GITHUB_OUTPUT"
      - name: Redirect legacy Switchyard hostname
        if: steps.deployment.outputs.configured == 'true'
        env:
          PUBLIC_SITE_ORIGIN: ${{ steps.public-origin.outputs.url }}
          REDIRECT_STATUS: ${{ steps.public-origin.outputs.redirect-status }}
        run: |
          legacy_directory="$RUNNER_TEMP/envarium-legacy-redirect"
          mkdir -p "$legacy_directory"
          printf '/* %s/:splat %s\n' "$PUBLIC_SITE_ORIGIN" "$REDIRECT_STATUS" > "$legacy_directory/_redirects"
          pnpm --dir site exec wrangler pages deploy "$legacy_directory" --project-name "$LEGACY_CLOUDFLARE_PROJECT_NAME" --branch master --commit-dirty=true
      - name: Smoke reachable public site
        if: steps.deployment.outputs.configured == 'true'
        env:
          SMOKE_SITE_URL: ${{ steps.public-origin.outputs.url }}
          SMOKE_CANONICAL_URL: https://envarium.davidcuellar.tech
        run: |
          for attempt in $(seq 1 30); do
            if pnpm --dir site smoke; then
              exit 0
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Public site is not ready yet; retrying in 10 seconds ($attempt/30)."
              sleep 10
            fi
          done
          exit 1
