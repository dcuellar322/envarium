name: Public site deploy

on:
  pull_request:
    paths: ['site/**', 'docs/**', 'web/tests/visual/**']
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SITE_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:generate
      - run: pnpm --dir site releases
      - run: pnpm site:build
      - run: pnpm site:validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-deploy-${{ github.sha }}
          path: site/dist
          retention-days: 7

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment: site-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Check deployment configuration
        id: deployment
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_PROJECT_NAME" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare preview skipped because deployment credentials are not configured."
          fi
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.deployment.outputs.configured == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-site-deploy-${{ github.sha }}
          path: site/dist
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm --dir site exec wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch "pr-${{ github.event.pull_request.number }}" --commit-dirty=true

  production:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      ENVARIUM_DOMAIN: envarium.davidcuellar.tech
      CLOUDFLARE_ZONE_NAME: davidcuellar.tech
      LEGACY_CLOUDFLARE_PROJECT_NAME: switchyard-dcuellar
    steps:
      - name: Check deployment configuration
        id: deployment
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_PROJECT_NAME" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare production deploy skipped because deployment credentials are not configured."
          fi
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.deployment.outputs.configured == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.deployment.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-site-deploy-${{ github.sha }}
          path: site/dist
      - name: Ensure Envarium Pages project exists
        if: steps.deployment.outputs.configured == 'true'
        run: |
          projects="$(pnpm --dir site exec wrangler pages project list --json)"
          if ! jq -e --arg project "$CLOUDFLARE_PROJECT_NAME" 'any(.[]; .["Project Name"] == $project)' <<< "$projects" >/dev/null; then
            pnpm --dir site exec wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch master
          fi
      - if: steps.deployment.outputs.configured == 'true'
        run: pnpm --dir site exec wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch master --commit-dirty=true
      - name: Ensure canonical custom domain
        if: steps.deployment.outputs.configured == 'true'
        run: |
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/domains"
          domains="$(curl --fail-with-body --silent --show-error "$endpoint" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json')"
          if ! jq -e --arg domain "$ENVARIUM_DOMAIN" 'any(.result[]?; .name == $domain)' <<< "$domains" >/dev/null; then
            response="$(curl --fail-with-body --silent --show-error --request POST "$endpoint" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg name "$ENVARIUM_DOMAIN" '{name: $name}')")"
            jq -e '.success == true' <<< "$response" >/dev/null
          fi
      - name: Ensure canonical DNS record
        if: steps.deployment.outputs.configured == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zones="$(curl --fail-with-body --silent --show-error \
            "$api/zones?name=$CLOUDFLARE_ZONE_NAME&status=active" \
            --header "$auth_header" \
            --header 'Content-Type: application/json')"
          zone_id="$(jq -r --arg name "$CLOUDFLARE_ZONE_NAME" \
            '.result[]? | select(.name == $name) | .id' <<< "$zones" | head -n 1)"
          if [[ -z "$zone_id" ]]; then
            echo "::error::Cloudflare zone $CLOUDFLARE_ZONE_NAME was not found or is not readable by the deployment token."
            exit 1
          fi

          records_endpoint="$api/zones/$zone_id/dns_records"
          records="$(curl --fail-with-body --silent --show-error \
            "$records_endpoint?name=$ENVARIUM_DOMAIN" \
            --header "$auth_header" \
            --header 'Content-Type: application/json')"
          record_id="$(jq -r '.result[0].id // empty' <<< "$records")"
          record_type="$(jq -r '.result[0].type // empty' <<< "$records")"
          if [[ -n "$record_id" && "$record_type" != "CNAME" ]]; then
            echo "::error::$ENVARIUM_DOMAIN already has a non-CNAME DNS record; refusing to replace it automatically."
            exit 1
          fi

          target="$CLOUDFLARE_PROJECT_NAME.pages.dev"
          payload="$(jq -nc \
            --arg type CNAME \
            --arg name "$ENVARIUM_DOMAIN" \
            --arg content "$target" \
            '{type: $type, name: $name, content: $content, proxied: true, ttl: 1}')"
          if [[ -n "$record_id" ]]; then
            response="$(curl --fail-with-body --silent --show-error --request PUT \
              "$records_endpoint/$record_id" \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data "$payload")"
          else
            response="$(curl --fail-with-body --silent --show-error --request POST \
              "$records_endpoint" \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data "$payload")"
          fi
          jq -e '.success == true' <<< "$response" >/dev/null
      - name: Redirect legacy Switchyard hostname
        if: steps.deployment.outputs.configured == 'true'
        run: |
          legacy_directory="$RUNNER_TEMP/envarium-legacy-redirect"
          mkdir -p "$legacy_directory"
          printf '/* https://%s/:splat 301\n' "$ENVARIUM_DOMAIN" > "$legacy_directory/_redirects"
          pnpm --dir site exec wrangler pages deploy "$legacy_directory" --project-name "$LEGACY_CLOUDFLARE_PROJECT_NAME" --branch master --commit-dirty=true
      - name: Smoke canonical domain
        if: steps.deployment.outputs.configured == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if pnpm --dir site smoke; then
              exit 0
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Canonical domain is not ready yet; retrying in 10 seconds ($attempt/30)."
              sleep 10
            fi
          done
          exit 1
