packages:
  - web
  - site

overrides:
  'postcss-nested@6>postcss-selector-parser': 7.1.6 # GHSA-rj75-hqrm-r3gf
  fast-uri: 3.1.8
  js-yaml: 4.3.2
  sharp: 0.35.5
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  'smol-toml@<1.8.1': 1.9.0
  'undici@7': 7.29.1
  'undici@8': 8.11.2
  'vite@8': 8.2.4 # GHSA-587h-7wmj-h5pm

minimumReleaseAge: 14400
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# Exact security fixes; retain the age gate for all other versions.
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0 # GHSA-ch52-4w7c-c8xp
  - sharp@0.35.5 # GHSA-wq5f-xc86-pv6w
  - source-map-js@1.2.2 # GHSA-68fv-2mgg-jv7q
  - vite@8.2.4 # GHSA-587h-7wmj-h5pm

update:
  githubActions: true
  ignoreDeps:
    - type-fest
    - typescript

allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
